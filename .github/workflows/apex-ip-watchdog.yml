# Hourly check that the bare domain (tusharrajgupta.in) still serves the site.
#
# GoDaddy can't point the bare domain at Azure by name, so it uses an A record with an Azure IP.
# Azure serves Static Web Apps from different IPs in different regions, and doesn't guarantee they
# stay the same. So instead of comparing IP lists (which differ by region), this connects to the
# exact IP in the A record and confirms it still serves the site over HTTPS with a valid certificate.
# If not, the run fails and GitHub emails you: get the current IP from Azure Portal →
# Static Web App → Custom domains → tusharrajgupta.in, and update the "A @" record in GoDaddy DNS.

name: Bare domain IP watchdog

on:
  schedule:
    - cron: "17 * * * *" # hourly, at :17 (off the hour, when GitHub's schedulers are less busy)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      APEX: tusharrajgupta.in
      EXPECT: "Raj Gupta" # text that must appear on the page
    steps:
      - name: Check the IP in the A record serves the site over HTTPS
        run: |
          set -uo pipefail
          ips=$(dig +short "$APEX" A @1.1.1.1 | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -u)
          echo "A record for $APEX: $(echo $ips)"
          {
            echo "### Bare domain check: \`$APEX\`"
            echo "| IP in A record | HTTPS status | Valid certificate | Site content |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$ips" ]; then
            echo "::error title=No A record::$APEX has no A record. Add one in GoDaddy DNS (value: the IP shown in Azure Portal → Custom domains)."
            exit 1
          fi

          failed=0
          for ip in $ips; do
            # connect to this exact IP, but ask for the bare domain (checks hosting + certificate together)
            code=$(curl -s -o page.html --max-time 20 -w '%{http_code}' --resolve "$APEX:443:$ip" "https://$APEX/") ; rc=$?
            cert=$([ $rc -eq 60 ] || [ $rc -eq 51 ] && echo "no" || echo "yes")
            content=$(grep -q "$EXPECT" page.html 2>/dev/null && echo "yes" || echo "no")
            echo "$ip -> HTTP $code (curl exit $rc), certificate ok: $cert, content ok: $content"
            echo "| $ip | $code | $cert | $content |" >> "$GITHUB_STEP_SUMMARY"
            if [ $rc -ne 0 ] || [ "${code:0:1}" != "2" ] || [ "$content" != "yes" ]; then
              failed=1
              echo "::error title=Bare domain not served at $ip::https://$APEX/ via $ip returned HTTP $code (curl exit $rc, content ok: $content). Azure may have moved the app: get the current IP from Azure Portal → Static Web App → Custom domains → $APEX, and update the A @ record in GoDaddy DNS."
            fi
          done

          if [ $failed -eq 0 ]; then
            echo "All good: every IP in the A record serves the site."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ All good." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $failed
